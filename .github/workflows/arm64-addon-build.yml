name: Full Application build

on:
  workflow_dispatch:
    inputs:
      package_index:
        description: Package registry for the pinned application version
        required: true
        type: choice
        default: https://pypi.org/simple/
        options:
          - https://pypi.org/simple/
          - https://test.pypi.org/simple/

permissions:
  contents: read

jobs:
  addon-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Select exact Toposync wheels from TestPyPI
        if: inputs.package_index == 'https://test.pypi.org/simple/'
        id: test-packages
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          version = re.search(r"^ARG TOPOSYNC_PIP_SPEC=toposync-streaming==(.+)$", Path("toposync/Dockerfile").read_text(), re.M)[1]
          packages = [
              "toposync-core", "toposync", "toposync-streaming",
              "toposync-ext-structural", "toposync-ext-models", "toposync-ext-home-assistant",
              "toposync-ext-images", "toposync-ext-cameras", "toposync-ext-ptz-attention",
              "toposync-ext-vision", "toposync-ext-spatial-video",
              "toposync-ext-cinematic", "toposync-ext-streaming",
          ]
          specs = ["fastapi", "httpx", "uvicorn"]
          for package in packages:
              with urllib.request.urlopen(f"https://test.pypi.org/pypi/{package}/{version}/json", timeout=30) as response:
                  release = json.load(response)
              assert release["info"]["version"] == version
              wheels = [item for item in release["urls"] if item["packagetype"] == "bdist_wheel" and not item["yanked"]]
              assert len(wheels) == 1, package
              wheel = wheels[0]
              url = urllib.parse.urlsplit(wheel["url"])
              assert url.scheme == "https" and url.hostname.endswith(".pythonhosted.org")
              digest = wheel["digests"]["sha256"]
              assert re.fullmatch(r"[a-f0-9]{64}", digest)
              specs.append(f"{wheel['url']}#sha256={digest}")
              if package == "toposync-streaming":
                  root_spec = specs.pop()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("specs=" + " ".join(specs) + "\n")
              output.write("root_spec=" + root_spec + "\n")
          PYTHON
      - name: Build full application image
        env:
          ROOT_PIP_SPEC: ${{ steps.test-packages.outputs.root_spec }}
          ADDON_PIP_SPECS: ${{ steps.test-packages.outputs.specs || 'fastapi httpx uvicorn' }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          root_spec="${ROOT_PIP_SPEC:-$(sed -n 's/^ARG TOPOSYNC_PIP_SPEC=//p' toposync/Dockerfile)}"
          docker buildx build --platform "$PLATFORM" \
            --build-arg "TOPOSYNC_PIP_SPEC=$root_spec" \
            --build-arg "TOPOSYNC_ADDON_PIP_SPECS=$ADDON_PIP_SPECS" \
            -t local/toposync-addon --load ./toposync
      - name: Check installed application version
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          expected=$(sed -n 's/^ARG TOPOSYNC_PIP_SPEC=toposync-streaming==//p' toposync/Dockerfile)
          docker run --rm --platform "$PLATFORM" --entrypoint /opt/toposync/.venv/bin/python \
            local/toposync-addon -c 'from importlib.metadata import version; import sys; assert version("toposync-streaming") == sys.argv[1]; assert version("toposync-core") == sys.argv[1]; print("Installed application version:", sys.argv[1])' "$expected"
