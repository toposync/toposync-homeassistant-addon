name: Full Application build

on:
  workflow_dispatch:
    inputs:
      package_index:
        description: Package registry for the pinned application version
        required: true
        type: choice
        default: https://pypi.org/simple/
        options:
          - https://pypi.org/simple/
          - https://test.pypi.org/simple/

permissions:
  contents: read

jobs:
  addon-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build full application image
        env:
          PACKAGE_INDEX: ${{ inputs.package_index }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker buildx build --platform "$PLATFORM" \
            --build-arg "TOPOSYNC_PIP_INDEX_URL=$PACKAGE_INDEX" \
            --build-arg TOPOSYNC_EXTRA_INDEX_URL=https://pypi.org/simple/ \
            -t local/toposync-addon --load ./toposync
      - name: Check installed application version
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          expected=$(sed -n 's/^ARG TOPOSYNC_PIP_SPEC=toposync-streaming==//p' toposync/Dockerfile)
          docker run --rm --platform "$PLATFORM" --entrypoint /opt/toposync/.venv/bin/python \
            local/toposync-addon -c 'from importlib.metadata import version; import sys; assert version("toposync-streaming") == sys.argv[1]; assert version("toposync-core") == sys.argv[1]; print("Installed application version:", sys.argv[1])' "$expected"
