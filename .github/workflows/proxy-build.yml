name: Proxy validation
on:
  push:
    paths: ["toposync_proxy/**", "tests/test_proxy.py", ".github/workflows/proxy-build.yml"]
  pull_request:
    paths: ["toposync_proxy/**", "tests/test_proxy.py", ".github/workflows/proxy-build.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nginx openssl
      - run: NGINX_BINARY=/usr/sbin/nginx python3 -m unittest discover -s tests -v
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build proxy image
        run: docker buildx build --platform '${{ matrix.platform }}' --load -t local/toposync-proxy ./toposync_proxy
      - name: Check authentication module
        run: docker run --rm --platform '${{ matrix.platform }}' --entrypoint nginx local/toposync-proxy -V 2>&1 | grep -- --with-http_auth_request_module
      - name: Check generated configuration
        run: |
          docker run --rm --platform '${{ matrix.platform }}' --entrypoint sh local/toposync-proxy -ec '
            mkdir -p /data
            python3 -c '\''import json; json.dump({"server_url":"https://example.test", "proxy_token":"a"*48}, open("/data/options.json", "w"))'\''
            python3 /usr/local/bin/run_proxy.py &
            proxy_pid=$!
            trap "kill $proxy_pid 2>/dev/null || true" EXIT
            for attempt in 1 2 3 4 5; do
              if wget -q -O /dev/null http://127.0.0.1:8098/; then exit 0; fi
              sleep 1
            done
            exit 1
          '
