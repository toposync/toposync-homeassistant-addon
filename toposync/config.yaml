name: Toposync
version: "0.7.7"
slug: toposync
description: Run Toposync inside Home Assistant with ingress and internal Core API access.
url: https://github.com/toposync/toposync-homeassistant-addon
startup: application
boot: auto
panel_title: Toposync
panel_icon: mdi:vector-polyline
panel_admin: true
ingress: true
ingress_port: 18757
ingress_stream: true
homeassistant_api: true
hassio_api: true
hassio_role: default
ports:
  18756/tcp: null
  18758/tcp: null
  18760/tcp: null
  18762/udp: null
ports_description:
  18756/tcp: Toposync web interface and API for direct access and mobile apps.
  18758/tcp: Toposync RTSP streaming output.
  18760/tcp: Toposync WebRTC/WHEP streaming output.
  18762/udp: Toposync WebRTC media transport.
arch:
  - amd64
  - aarch64
watchdog: http://[HOST]:[PORT:18757]/api/health
schema: false
