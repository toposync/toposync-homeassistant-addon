name: Toposync Remote Instance
version: "0.11.0"
slug: toposync_proxy
description: Access an existing Toposync instance installed elsewhere. Only the connection runs here; processing and data stay remote.
url: https://github.com/toposync/toposync-homeassistant-addon/tree/main/toposync_proxy
startup: application
boot: auto
init: false
panel_title: Toposync Remote
panel_icon: mdi:server-network
panel_admin: true
ingress: true
ingress_port: 8099
ingress_stream: true
arch:
  - amd64
  - aarch64
options:
  server_url: ""
  proxy_token: ""
  allow_http: false
schema:
  server_url: url
  proxy_token: password
  allow_http: bool
